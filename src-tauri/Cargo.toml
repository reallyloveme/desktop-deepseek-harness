[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness (dsh) Desktop Wrapper"
authors = ["desktop-deepseek-harness"]
edition = "2021"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
